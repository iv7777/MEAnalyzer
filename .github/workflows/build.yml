name: Build Windows EXE

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller colorama crccheck pltable

      - name: Build MEA.exe
        run: python -m PyInstaller --onefile --clean --name MEA MEA.py

      - name: Package with database files
        shell: bash
        run: |
          mkdir -p package/MEA
          cp dist/MEA.exe MEA.dat FileTable.dat Huffman.dat LICENSE README.md Changelog.txt package/MEA/

      - name: Smoke test (show help and exit)
        working-directory: package/MEA
        run: .\MEA.exe -? -exit -duc

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MEA-windows
          path: package/MEA

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd package && 7z a "../MEA-${GITHUB_REF_NAME}-windows.zip" MEA
          cd ..
          gh release create "$GITHUB_REF_NAME" "MEA-${GITHUB_REF_NAME}-windows.zip" \
            --title "ME Analyzer $GITHUB_REF_NAME" --generate-notes
